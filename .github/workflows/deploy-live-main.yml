name: Deploy Live Domain (main)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: live-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build deployment directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deployment_temp
          mkdir -p deployment_temp

          # Root-level html files
          shopt -s nullglob
          for f in *.html; do
            cp "$f" deployment_temp/
          done

          # First-level folders that contain index.html (slug routes)
          while IFS= read -r -d '' d; do
            cp -R "$d" deployment_temp/
          done < <(find . -mindepth 1 -maxdepth 1 -type d \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'deployment_temp' \
            ! -name 'build' \
            ! -name 'update' \
            -exec test -f '{}/index.html' ';' -print0)

          # Core production files
          [ -f .htaccess ] && cp .htaccess deployment_temp/
          [ -f contact_handler.php ] && cp contact_handler.php deployment_temp/
          [ -d assets ] && cp -R assets deployment_temp/
          [ -d images ] && cp -R images deployment_temp/

      - name: Install lftp client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to hosting
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          : "${FTP_SERVER:?Missing FTP_SERVER secret}"
          : "${FTP_USERNAME:?Missing FTP_USERNAME secret}"
          : "${FTP_PASSWORD:?Missing FTP_PASSWORD secret}"

          REMOTE_DIR="${FTP_REMOTE_DIR:-/public_html/}"
          PORT="${FTP_PORT:-21}"

          # Safe mode: no --delete to prevent accidental data loss.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$PORT" "$FTP_SERVER" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set ftp:ssl-force true
          mirror -R --verbose --parallel=4 ./deployment_temp "$REMOTE_DIR"
          bye
          EOF
